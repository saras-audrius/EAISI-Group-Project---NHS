<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Marrowfield Orthopaedic Centre — pre-operative knee replacement outcome review. Clinical decision support over a synthetic cohort."
    />
    <title>Knee Outcome Review — Marrowfield Orthopaedic Centre</title>

    <!-- The app is light by default, regardless of the operating system: it is
         projected and printed, and a clinic room is brighter than the OS
         assumes. Dark applies only when a user chose it explicitly. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('mf-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* private mode: fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
